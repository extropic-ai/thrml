version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  commands:
    # Editable install so render_html.py can introspect the live thrml package.
    - pip install -e .[docs]
    # Match Torx: secret-free PR previews use fallback assets, but published
    # builds must authenticate and include the licensed fonts/videos.
    - |
      if [ -n "${DOCS_ASSETS_TOKEN:-}" ]; then
        git clone --depth 1 "https://x-access-token:${DOCS_ASSETS_TOKEN}@github.com/extropic-ai/docs-assets.git" docs_site/_assets
        test -d docs_site/_assets/fonts && test -f docs_site/_assets/videos/extropic.mp4 && test -f docs_site/_assets/videos/extropic-footer.mp4
      elif [ "${READTHEDOCS_VERSION_TYPE:-}" = "external" ]; then
        echo "DOCS_ASSETS_TOKEN unavailable for Read the Docs PR build; using fallback assets"
      else
        echo "DOCS_ASSETS_TOKEN is required on Read the Docs"
        false
      fi
    - python docs_site/scripts/render_html.py
    - mkdir -p "$READTHEDOCS_OUTPUT/html"
    - cp -r docs_site/rendered/. "$READTHEDOCS_OUTPUT/html/"
